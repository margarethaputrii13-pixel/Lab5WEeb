
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Mahasiswa</title>
</head>
<body>

    <h1>Kalkulator Nilai Mahasiswa</h1>

    <form id="formNilai">
        <label for="tugas">Nilai Tugas (0–100):</label><br>
        <input type="number" id="tugas" min="0" max="100" required>
        <br><br>

        <label for="uts">Nilai UTS (0–100):</label><br>
        <input type="number" id="uts" min="0" max="100" required>
        <br><br>

        <label for="uas">Nilai UAS (0–100):</label><br>
        <input type="number" id="uas" min="0" max="100" required>
        <br><br>

        <button type="submit">Hitung Nilai</button>
        <button type="reset">Reset</button>
    </form>

    <h2>Hasil Perhitungan</h2>
    <p>Nilai Akhir: <span id="nilaiAkhir">-</span></p>
    <p>Predikat: <span id="predikat">-</span></p>
    <p>Status: <span id="status">-</span></p>

    <script src="script.js"></script>
</body>
</html>
